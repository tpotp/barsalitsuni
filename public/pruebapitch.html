<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Amplitude Driven Pitch Shift Video</title>
<style>
body { font-family: sans-serif; background:#111; color:#eee; padding:20px }
button { padding:10px; font-size:16px }
video { margin-top:20px; width:100%; max-width:600px }
</style>
</head>
<body>

<h2>Pitch Shift por Amplitud</h2>
<input type="file" id="videoInput" accept="video/*"><br><br>
<button id="process">Procesar Video</button>

<video id="result" controls></video>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const { createFFmpeg, fetchFile } = FFmpeg;

const ffmpeg = createFFmpeg({ log: true });

function rms(buffer, start, size) {
  let sum = 0;
  for (let i = 0; i < size; i++) {
    const s = buffer[start + i] || 0;
    sum += s * s;
  }
  return Math.sqrt(sum / size);
}

function pitchShiftByResample(input, factor) {
  const outLength = Math.floor(input.length / factor);
  const output = new Float32Array(outLength);
  for (let i = 0; i < outLength; i++) {
    const x = i * factor;
    const i0 = Math.floor(x);
    const frac = x - i0;
    const s0 = input[i0] || 0;
    const s1 = input[i0 + 1] || 0;
    output[i] = s0 * (1 - frac) + s1 * frac;
  }
  return output;
}

function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);

  function writeString(o, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i));
  }

  writeString(0, "RIFF");
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(8, "WAVE");
  writeString(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, "data");
  view.setUint32(40, samples.length * 2, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s * 0x7fff, true);
  }
  return new Uint8Array(buffer);
}

document.getElementById("process").onclick = async () => {
  const file = document.getElementById("videoInput").files[0];
  if (!file) return alert("Sube un video");

  if (!ffmpeg.isLoaded()) await ffmpeg.load();

  ffmpeg.FS("writeFile", "in.mp4", await fetchFile(file));
  await ffmpeg.run("-i", "in.mp4", "-ac", "1", "-ar", "44100", "audio.wav");

  const audioData = ffmpeg.FS("readFile", "audio.wav");

  const ctx = new AudioContext({ sampleRate: 44100 });
  const audioBuf = await ctx.decodeAudioData(audioData.buffer);
  const input = audioBuf.getChannelData(0);

  const windowSize = 2048;
  const hop = 1024;
  let output = [];

  for (let i = 0; i < input.length - windowSize; i += hop) {
    const amp = rms(input, i, windowSize);
    const pitch = 1 + amp * 1.5; // ← MAPEO AMPLITUD → PITCH
    const chunk = input.slice(i, i + windowSize);
    const shifted = pitchShiftByResample(chunk, pitch);
    output.push(...shifted);
  }

  const outBuffer = new Float32Array(output);
  const wav = encodeWAV(outBuffer, 44100);

  ffmpeg.FS("writeFile", "audio_out.wav", wav);

  await ffmpeg.run(
    "-i", "in.mp4",
    "-i", "audio_out.wav",
    "-map", "0:v",
    "-map", "1:a",
    "-c:v", "copy",
    "out.mp4"
  );

  const result = ffmpeg.FS("readFile", "out.mp4");
  const url = URL.createObjectURL(new Blob([result.buffer], { type: "video/mp4" }));
  document.getElementById("result").src = url;
};
</script>

</body>
</html>
